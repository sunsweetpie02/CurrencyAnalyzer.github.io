
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="main-card">

            <h1>Currency Analyzer</h1>
            <p class="subtitle">Analyze currency exchange rates</p>

            <div class="mb-4">
                <label for="currency" class="form-label">Select currency</label>
                <select id="currency" class="form-select">
                    <option value="usd">USD — US Dollar</option>
                    <option value="eur">EUR — Euro</option>
                    <option value="gbp">GBP — British Pound</option>
                    <option value="pln">PLN — Polish Zloty</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="startDate" class="form-label">Start date</label>
                    <input type="date" id="startDate" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="endDate" class="form-label">End date</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
            </div>

            <button id="chartButton" class="btn btn-success w-100">
                Show Chart
            </button>

            <div id="message"></div>

            <div class="chart-container">
                <canvas id="currencyChart"></canvas>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        <p>
            Exchange rate data provided by
            <a href="https://bank.gov.ua/" target="_blank" rel="noopener noreferrer">
                National Bank of Ukraine (NBU)
            </a>.
        </p>
        <small>Official source of currency exchange rate information.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
